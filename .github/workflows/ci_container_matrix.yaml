name: CI

on: [ push ]
env:
  LIBSODIUM_VERSION: 1.0.21

jobs:
  upload:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rocky_version: [ "8", "9" ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build container
        run: docker build . --tag builder-${{ matrix.rocky_version }} --build-arg LIBSODIUM_VERSION=${LIBSODIUM_VERSION} --build-arg ROCKY_VERSION=${{ matrix.rocky_version }};

      - name: Build project
        run: docker run -t -i builder-${{ matrix.rocky_version }}
